name: whalebot

services:
  astrbot:
    image: ${ASTRBOT_IMAGE:-soulter/astrbot:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${ASTRBOT_WEBUI_PORT:-6185}:6185"
    volumes:
      - astrbot-data:/AstrBot/data
      - ./scripts/yt-dlp:/usr/local/bin/yt-dlp:ro

  snowluma:
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:v2.2.1}
    restart: unless-stopped
    shm_size: 1gb
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VNC_PASSWD: ${VNC_PASSWD:?Set a private VNC_PASSWD in .env}
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: "--disable-gpu --disable-software-rasterizer --disable-gpu-compositing"
    ports:
      - "127.0.0.1:${SNOWLUMA_WEBUI_PORT:-5099}:5099"
      - "127.0.0.1:${NOVNC_PORT:-6081}:6081"
      - "127.0.0.1:${ONEBOT_WS_PORT:-3001}:3001"
    volumes:
      - snowluma-data:/app/data
      - qq-client-config:/app/.config
      - qq-client-data:/app/.local/share

volumes:
  astrbot-data:
  snowluma-data:
  qq-client-config:
  qq-client-data:
